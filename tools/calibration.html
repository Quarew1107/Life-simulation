<script>
// Calibration report: calibration.html?seeds=a,b,c&years=80&cfg={"founders":150}
// Runs the default (Malaysia) settings and compares the results with DOSM figures.
(function () {
  const q = new URLSearchParams(location.search);
  const seeds = (q.get('seeds') || 'cal-1,cal-2,cal-3').split(','), years = Number(q.get('years') || 80);
  const extra = JSON.parse(q.get('cfg') || '{"founders":150,"crime":"realistic","freezeLaws":"yes"}'); // realistic crime (Lively x10 distorts the demography), Malaysian laws held fixed
  const out = document.getElementById('out'), rows = [];
  out.textContent = `Running ${seeds.length} seeds x ${years} years...`;
  let i = 0;
  function next() {
    if (i >= seeds.length) {
      out.textContent = LES.Calibration.table(rows) + '\n\nSources:\n' + Object.values(LES.Calibration.TARGETS).map(t => `- ${t.label}: ${t.src}`).join('\n');
      document.title = 'calibration done';
      return;
    }
    const w = new LES.World(Object.assign({ seed: seeds[i] }, extra));
    const step = () => {
      const stop = Math.min(years * 365, w.day + 3650);
      while (!w.ended && w.day < stop) w.step();
      out.textContent = `Seed ${seeds[i]}: year ${Math.floor(w.day / 365)} of ${years}`;
      if (w.ended || w.day >= years * 365) { rows.push(LES.Calibration.measure(w)); i++; setTimeout(next, 0); } else setTimeout(step, 0);
    };
    step();
  }
  next();
})();
</script></body></html>
