<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Evolution Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="logo">LES</div>
      <div>
        <div class="title">Life Evolution Simulator</div>
        <div class="sub" id="town-sub">Bandar Rezeki · demo</div>
      </div>
    </div>
    <div class="clock">
      <div id="date-text">1 Jan Y1</div>
      <div id="time-text" class="muted">06:00</div>
    </div>
    <div id="scn-badge" class="hidden"></div>
    <div id="town-switch" class="hidden" role="group" aria-label="Town"></div>
    <div id="regime" class="badge">Normal economy</div>
    <div id="mood" class="infl"></div>
    <div id="speed" class="speed" role="group" aria-label="Simulation speed"></div>
    <button id="btn-step" class="ghost" title="Advance one day (S)">+1 day</button>
    <button id="btn-cast" class="ghost" title="Create your own person and add them to the town now (P). Your saved people are in the Leaders tab → ★ My cast.">＋ Person</button>
    <div id="kpis" class="kpis"></div>
    <div id="goal" class="goal"></div>
    <button id="btn-report" class="ghost" data-icon="chart" title="Open the simulation report in a new tab">Report</button>
    <button id="btn-save" class="ghost" data-icon="save" title="Save this world to a file (load it from the New world screen)">Save</button>
    <button id="btn-new" class="primary" title="Create a new world">New world</button>
  </header>
  <main>
    <section id="map-wrap">
      <canvas id="map" aria-label="Town map. Click a person to inspect them."></canvas>
      <div id="map-tools">
        <button data-z="in" title="Zoom in" aria-label="Zoom in" data-icon="plus"></button>
        <button data-z="out" title="Zoom out" aria-label="Zoom out" data-icon="minus"></button>
        <button data-z="fit" title="Fit town" aria-label="Fit town" data-icon="expand"></button>
        <div class="vol-wrap">
          <button data-z="sound" id="btn-sound" title="Music &amp; sound effects (off by default)" aria-label="Sound" data-icon="volume-x"></button>
          <div id="vol-pop" class="hidden">
            <label title="Music volume">🎵<input type="range" id="vol-music" min="0" max="100" step="1" aria-label="Music volume"></label>
            <label title="Sound effects volume">🔔<input type="range" id="vol-sfx" min="0" max="100" step="1" aria-label="Sound effects volume"></label>
          </div>
        </div>
        <select id="overlay" title="Map overlay" aria-label="Map overlay"></select>
        <button data-z="director" id="btn-director" title="Director mode: the camera jumps to the most interesting moments" aria-label="Director mode" data-icon="film"></button>
      </div>
      <div id="toasts" aria-live="polite"></div>
      <div id="tooltip" class="hidden"></div>
      <div id="caption" class="hidden"></div>
      <div id="map-hint">Click a person or building · drag to pan · scroll to zoom · Space to pause</div>
    </section>
    <aside id="side">
      <nav id="tabs">
        <button data-tab="person" data-icon="user" title="The selected person" class="active"><span>Person</span></button>
        <button data-tab="leaders" data-icon="trophy" title="Leaderboards and search"><span>Leaders</span></button>
        <button data-tab="feed" data-icon="notes" title="What is happening in town"><span>Events</span></button>
        <button data-tab="place" data-icon="building" title="The selected building"><span>Place</span></button>
        <button data-tab="stats" data-icon="chart" title="Town statistics and charts"><span>Stats</span></button>
        <button data-tab="society" data-icon="users" title="Class, ethnicity and religion"><span>Society</span></button>
        <button data-tab="crime" data-icon="shield" title="Crime, police and justice"><span>Crime</span></button>
        <button data-tab="gov" data-icon="flag" title="Government, council and treasury"><span>Gov't</span></button>
      </nav>
      <div id="tab-person" class="tab active"></div>
      <div id="tab-leaders" class="tab">
        <div class="tab-tools">
          <input id="search" type="search" placeholder="Search people by name…" autocomplete="off">
          <div class="seg wrap" id="lb-mode"><button data-mode="alive" class="on" title="Richest people alive now">💰 Richest</button><button data-mode="all" title="Highest net worth ever reached">All-time</button><button data-mode="happy" title="Happiest adults">😊 Happiest</button><button data-mode="family" title="Most children">👪 Family</button><button data-mode="fit" title="Fittest: average strength, endurance and agility">💪 Fittest</button><button data-mode="goals" title="Most life goals achieved">🎯 Goals</button><button data-mode="cast" title="Your own characters: create them and follow their lives">★ My cast</button><button data-mode="marks" title="People and families you bookmarked">🔖 Bookmarks</button></div>
        </div>
        <div id="lb-list"></div>
      </div>
      <div id="tab-feed" class="tab">
        <div class="tab-tools"><div class="seg wrap" id="feed-filter"></div><button class="ghost" id="btn-news" data-icon="news" title="The town newspaper: a front page every month">Newspaper</button></div>
        <div id="feed-list"></div>
      </div>
      <div id="tab-place" class="tab"></div>
      <div id="tab-stats" class="tab"></div>
      <div id="tab-society" class="tab"></div>
      <div id="tab-crime" class="tab"></div>
      <div id="tab-gov" class="tab"></div>
    </aside>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
<div id="error-banner" class="hidden"></div>

<script src="js/core/rng.js"></script>
<script src="js/core/util.js"></script>
<script src="js/data/countries/countries.js"></script>
<script src="js/data/countries/my.js"></script>
<script src="js/data/countries/uk.js"></script>
<script src="js/data/countries/us.js"></script>
<script src="js/data/countries/cn.js"></script>
<script src="js/data/content.js"></script>
<script src="js/data/params.js"></script>
<script src="js/data/town.js"></script>
<script src="js/data/region-map.js"></script>
<script src="js/sim/ledger.js"></script>
<script src="js/sim/systems.js"></script>
<script src="js/sim/person.js"></script>
<script src="js/sim/market.js"></script>
<script src="js/sim/actions.js"></script>
<script src="js/sim/labour.js"></script>
<script src="js/sim/finance.js"></script>
<script src="js/sim/family.js"></script>
<script src="js/sim/migration.js"></script>
<script src="js/sim/goals.js"></script>
<script src="js/sim/society.js"></script>
<script src="js/sim/crime.js"></script>
<script src="js/sim/government.js"></script>
<script src="js/sim/china.js"></script>
<script src="js/sim/news.js"></script>
<script src="js/sim/god.js"></script>
<script src="js/sim/services.js"></script>
<script src="js/sim/fiscal.js"></script>
<script src="js/sim/council.js"></script>
<script src="js/sim/scenarios.js"></script>
<script src="js/sim/region.js"></script>
<script src="js/sim/cast.js"></script>
<script src="js/sim/world.js"></script>
<script src="js/sim/save.js"></script>
<script src="js/sim/calibration.js"></script>
<script src="js/render/art.js"></script>
<script src="js/render/sprites.js"></script>
<script src="js/render/ambience.js"></script>
<script src="js/render/tiles.js"></script>
<script src="js/render/renderer.js"></script>
<script src="js/render/region-view.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/charts.js"></script>
<script src="js/ui/panels.js"></script>

<script src="js/ui/report.js"></script>

<script src="js/ui/compare.js"></script>
<script src="js/ui/minimap.js"></script>
<script src="js/ui/spectator.js"></script>
<script src="js/ui/extras.js"></script>
<script src="js/ui/society-ui.js"></script>
<script src="js/ui/crime-ui.js"></script>
<script src="js/ui/gov-ui.js"></script>
<script src="js/ui/audio.js"></script>
<script src="js/ui/cast-ui.js"></script>
<script src="js/ui/setup.js"></script>
<script src="js/main.js"></script>
</body>
</html>
